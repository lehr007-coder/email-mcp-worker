name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --omit=optional 2>/dev/null || true

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FOLLOW_UP_BOSS_API_KEY: ${{ secrets.FOLLOW_UP_BOSS_API_KEY }}
          FOLLOW_UP_BOSS_X_SYSTEM: ${{ secrets.FOLLOW_UP_BOSS_X_SYSTEM }}
          FOLLOW_UP_BOSS_X_SYSTEM_KEY: ${{ secrets.FOLLOW_UP_BOSS_X_SYSTEM_KEY }}
        run: |
          echo "✅ Deployment ready with all configured secrets"
          echo "Cloudflare Account: $CLOUDFLARE_ACCOUNT_ID"
          echo "Follow Up Boss System: $FOLLOW_UP_BOSS_X_SYSTEM"

          if [ -f "wrangler.toml" ]; then
            npm install -g wrangler
            wrangler deploy
          else
            echo "⚠️  No wrangler.toml found - skipping deployment"
            echo "To enable deployment, create a wrangler.toml configuration file"
          fi

      - name: Deployment Status
        run: echo "✅ Worker deployment workflow completed"
