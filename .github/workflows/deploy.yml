name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=optional 2>/dev/null || true

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FOLLOW_UP_BOSS_API_KEY: ${{ secrets.FOLLOW_UP_BOSS_API_KEY }}
          FOLLOW_UP_BOSS_X_SYSTEM: ${{ secrets.FOLLOW_UP_BOSS_X_SYSTEM }}
          FOLLOW_UP_BOSS_X_SYSTEM_KEY: ${{ secrets.FOLLOW_UP_BOSS_X_SYSTEM_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is empty — secret not visible to this repo"
            exit 1
          fi
          echo "✅ Secrets present"

          if [ -f "wrangler.toml" ]; then
            npm install -g wrangler
            wrangler deploy
          else
            echo "⚠️  No wrangler.toml found - skipping deployment"
          fi

      - name: Deployment Status
        run: echo "✅ Worker deployment workflow completed"
